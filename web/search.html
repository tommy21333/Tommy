<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хайлт — MovieVIP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>
  <main class="container">
    <h2 class="section-title" id="title">Хайлтын үр дүн</h2>
    <div id="content"></div>
  </main>
  <footer id="footer"></footer>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      bootChrome();
      const q = new URLSearchParams(location.search).get('q') || '';
      document.getElementById('title').textContent = q ? `"${q}" — хайлтын үр дүн` : 'Бүх кино';
      const movies = Store.search(q);
      document.getElementById('content').innerHTML = movies.length
        ? `<div class="grid">${movies.map((m) => `
            <div class="card" onclick="location.href='movie.html?id=${m.id}'">${posterHtml(m.poster_url, m.title)}
              <div class="card-body"><div class="card-title">${esc(m.title)}</div>
              <div class="card-meta">${m.year || ''} ${m.genre ? '· ' + esc(m.genre) : ''}</div></div></div>`).join('')}</div>`
        : `<p style="color:var(--muted)">Илэрц олдсонгүй.</p>`;
    })();
  </script>
</body>
</html>
