<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нэвтрэх — MovieVIP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>
  <div class="auth-wrap">
    <div class="panel">
      <h1>Нэвтрэх</h1>
      <p class="sub">VIP кино үзэхийн тулд нэвтэрнэ үү</p>
      <div id="msg" class="msg"></div>
      <form id="form">
        <label>И-мэйл</label><input type="email" id="email" required>
        <label>Нууц үг</label><input type="password" id="password" required>
        <button class="btn btn-primary btn-block" type="submit">Нэвтрэх</button>
      </form>
      <p class="center">Бүртгэлгүй юу? <a class="link" href="register.html">Бүртгүүлэх</a></p>
      <p class="center" style="font-size:12px">Туршилтын админ: admin@movie.mn / admin123</p>
    </div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    bootChrome();
    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault(); const msg = document.getElementById('msg'); msg.className = 'msg';
      try { Store.login(email.value, password.value); location.href = 'index.html'; }
      catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
    };
  </script>
</body>
</html>
