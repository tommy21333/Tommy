<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бүртгүүлэх — MovieVIP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>
  <div class="auth-wrap">
    <div class="panel">
      <h1>Бүртгүүлэх</h1>
      <p class="sub">Шинэ бүртгэл үүсгэ. VIP эрхийг админ идэвхжүүлнэ.</p>
      <div id="msg" class="msg"></div>
      <form id="form">
        <label>Нэр</label><input type="text" id="name" required>
        <label>И-мэйл</label><input type="email" id="email" required>
        <label>Нууц үг (6+ тэмдэгт)</label><input type="password" id="password" required minlength="6">
        <button class="btn btn-primary btn-block" type="submit">Бүртгүүлэх</button>
      </form>
      <p class="center">Бүртгэлтэй юу? <a class="link" href="login.html">Нэвтрэх</a></p>
    </div>
  </div>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    bootChrome();
    document.getElementById('form').onsubmit = (e) => {
      e.preventDefault(); const msg = document.getElementById('msg'); msg.className = 'msg';
      try { Store.register(name.value, email.value, password.value); location.href = 'vip.html'; }
      catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
    };
  </script>
</body>
</html>
