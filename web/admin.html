<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — MovieVIP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>
  <main class="container">
    <h2 class="section-title">🛠 Админ удирдлага</h2>
    <div id="guard"></div>
    <div id="panel" class="hide">
      <div class="admin-tabs">
        <button class="btn active" data-tab="movies" onclick="switchTab('movies')">🎬 Кино & Анги</button>
        <button class="btn" data-tab="users" onclick="switchTab('users')">👥 Хэрэглэгч & VIP</button>
      </div>

      <div id="tab-movies">
        <div class="two-col">
          <div class="panel">
            <h3 id="movieFormTitle">➕ Шинэ кино нэмэх</h3>
            <div id="movieMsg" class="msg"></div>
            <form id="movieForm">
              <input type="hidden" id="m_id">
              <label>Нэр *</label><input id="m_title" required>
              <label>Товч агуулга</label><textarea id="m_desc"></textarea>
              <label>Постер зураг (файл)</label><input type="file" id="m_poster_file" accept="image/*">
              <label>эсвэл Постер URL</label><input id="m_poster_url" placeholder="https://...">
              <div class="two-col">
                <div><label>Он</label><input id="m_year" type="number"></div>
                <div><label>Төрөл (жанр)</label><input id="m_genre" placeholder="Адал явдалт"></div>
              </div>
              <div class="two-col">
                <div><label>Улс</label><input id="m_country"></div>
                <div><label>Төрөл</label><select id="m_is_series"><option value="0">Кино</option><option value="1">Олон ангит</option></select></div>
              </div>
              <label><input type="checkbox" id="m_featured" style="width:auto;display:inline"> Нүүр хуудсанд онцлох</label>
              <button class="btn btn-primary btn-block" type="submit">Хадгалах</button>
              <button class="btn btn-block hide" type="button" id="movieCancel" onclick="resetMovieForm()">Болих</button>
            </form>
          </div>
          <div class="panel"><h3>Киноны жагсаалт</h3><div id="movieList"></div></div>
        </div>

        <div class="panel" id="epPanel" style="margin-top:16px">
          <h3 id="epTitle">Анги нэмэхийн тулд кино сонгоно уу</h3>
          <div id="epArea" class="hide">
            <div id="epMsg" class="msg"></div>
            <form id="epForm" class="two-col">
              <input type="hidden" id="e_id">
              <div><label>Ангийн дугаар</label><input id="e_number" type="number" value="1"></div>
              <div><label>Ангийн нэр (заавал биш)</label><input id="e_title"></div>
              <div><label>Видео төрөл</label><select id="e_video_type">
                <option value="file">MP4/WebM файл (шууд линк)</option>
                <option value="hls">HLS урсгал (.m3u8)</option>
                <option value="embed">Embed (iframe линк)</option></select></div>
              <div><label>Үргэлжлэх хугацаа</label><input id="e_duration" placeholder="45:00"></div>
              <div style="grid-column:1/-1"><label>Видео линк *</label><input id="e_video_url" required placeholder="https://.../video.mp4"></div>
              <button class="btn btn-primary" type="submit" style="grid-column:1/-1">Анги хадгалах</button>
            </form>
            <div id="epList" style="margin-top:14px"></div>
          </div>
        </div>
      </div>

      <div id="tab-users" class="hide">
        <div class="panel">
          <h3>👥 Хэрэглэгчид</h3>
          <div class="search" style="max-width:400px;margin-bottom:14px">
            <input id="userSearch" placeholder="Нэр / и-мэйлээр хайх" oninput="loadUsers(this.value)">
          </div>
          <div id="userMsg" class="msg"></div>
          <div style="overflow-x:auto"><div id="userList"></div></div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
